name: Reproduce public lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record runtime
        run: |
          git rev-parse HEAD
          python3 --version
          python3 -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"
      - name: Run assertions
        run: python3 -m unittest -v
      - name: Run synthetic demo
        run: python3 replay_lab.py
      - name: Check deliberate mutation
        run: python3 check_mutation.py
